apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: build-and-deploy
  namespace: tekton-pipelines
spec:
  params:
    - name: repo-url
      description: URL del repositorio Git
      type: string
      default: "https://github.com/dguerrero11/page-public-demo"
    - name: revision
      description: Branch o tag a construir
      type: string
      default: main
    - name: image
      description: "Imagen con tag. El tag es solo una etiqueta legible: lo que
        se despliega es el digest que este pipeline devuelve en IMAGE_DIGEST."
      type: string
      default: "guerrero11dan/page-public-demo:v2"
  workspaces:
    - name: shared-source
      description: Workspace NFS compartido entre Tasks
  results:
    - name: IMAGE_DIGEST
      description: Digest de la imagen construida, para fijar en k8s/deployment.yaml
      value: $(tasks.build-push.results.IMAGE_DIGEST)
  tasks:
    - name: clone
      taskRef:
        name: git-clone
      params:
        - name: url
          value: $(params.repo-url)
        - name: revision
          value: $(params.revision)
      workspaces:
        - name: source
          workspace: shared-source

    - name: build-push
      taskRef:
        name: build-push
      runAfter:
        - clone
      params:
        - name: image
          value: $(params.image)
      workspaces:
        - name: source
          workspace: shared-source
