apiVersion: apps/v1
kind: Deployment
metadata:
  name: page-demo
  namespace: demo
  labels:
    app: page-demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: page-demo
  template:
    metadata:
      labels:
        app: page-demo
    spec:
      containers:
        - name: page-demo
          # Imagen fijada por digest, no por tag. El tag :v2 es mutable y llego
          # a apuntar a tres builds distintos: las replicas servian contenido
          # diferente sin que Argo CD lo reportara como OutOfSync.
          # Para desplegar una version nueva: construir, tomar el digest del
          # result IMAGE_DIGEST del pipeline y cambiarlo aqui en un commit.
          image: guerrero11dan/page-public-demo@sha256:3b8e682442ed4586463abe955f082d0a6330fef03a894c5a50f28b3572b56ce3
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "100m"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
